# car.hueeng.com — 심플차계부 공개 문서 (GitHub Pages 와 같은 파일)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # GitHub Pages 주소 형태(/simcha-site/...)로 들어와도 같은 문서를 보여준다
    location ^~ /simcha-site/ {
        rewrite ^/simcha-site/(.*)$ /$1 last;
    }

    # 저장소 내부 파일은 공개하지 않는다 (.git, .nojekyll, 배포 설정, README)
    location ~ /\.(?!well-known/) { return 404; }
    location ^~ /deploy/ { return 404; }
    location = /README.md { return 404; }

    # 앱 채팅방 초대 링크: 안내 페이지(앱에서 열기 버튼)를 200 으로
    location ^~ /chat/invite/ {
        default_type text/html;
        try_files /404.html =404;
    }

    # /privacy → privacy.html (확장자 없는 주소)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
