# car.hueeng.com — 심플차계부 공개 문서 (GitHub Pages 와 같은 파일)
# compose 가 deploy/ 디렉터리를 /etc/nginx/conf.d 로 마운트한다 (*.conf 인 이 파일만 읽힘).

# Cloudflare 가 알려 주는 방문자 스킴이 http 면 https 로. app-ads.txt 는 크롤러용으로 그대로 둔다.
map "$http_x_forwarded_proto:$request_uri" $simcha_force_https {
    default 0;
    "~^http:(?!/app-ads\.txt(\?|$))" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    if ($simcha_force_https) {
        return 301 https://$host$request_uri;
    }

    # (location 안에서 add_header 를 쓰면 이 값들이 상속되지 않으니 location 에는 add_header 금지)
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # no-transform: Cloudflare 가 mailto 를 /cdn-cgi/l/email-protection 으로 바꾸지 않게
    # (JS 없이 읽는 크롤러·심사 도구에도 연락처 이메일이 그대로 보여야 한다)
    add_header Cache-Control "no-transform" always;

    # GitHub Pages 주소 형태(/simcha-site/...)로 들어와도 같은 문서를 보여준다
    location ^~ /simcha-site/ {
        rewrite ^/simcha-site/(.*)$ /$1 last;
    }

    # 저장소 내부 파일은 공개하지 않는다 (.git, .nojekyll, 배포 설정, README)
    location ~ /\.(?!well-known/) { return 404; }
    location ^~ /deploy/ { return 404; }
    location = /README.md { return 404; }

    # 앱 채팅방 초대 링크: 안내 페이지(앱에서 열기 버튼)를 200 으로
    location ^~ /chat/invite/ {
        default_type text/html;
        try_files /404.html =404;
    }

    # /privacy → privacy.html (확장자 없는 주소)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
