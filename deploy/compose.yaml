# 홈서버(Proxmox LXC 101) 운영 스택 — car.hueeng.com
#
#   서버 배치:  /opt/simcha-site/site         ← 이 저장소 clone (웹 루트)
#               /opt/simcha-site/.cloudflared ← "simcha-site" 터널 config.yml + tunnel.json (65532, 600, git 밖)
#   실행:       cd /opt/simcha-site/site && docker compose -f deploy/compose.yaml up -d
#   갱신:       deploy/deploy-homelab.sh (git pull 후 nginx reload)
name: simcha-site
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ..:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:3105:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    user: "65532:65532"
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ${SIMCHA_TUNNEL_DIR:-/opt/simcha-site/.cloudflared}:/etc/cloudflared:ro
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m
    pids_limit: 64
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
