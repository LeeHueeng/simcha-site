<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>심플차계부</title><link rel="stylesheet" href="/simcha-site/style.css"></head>
<body>
<h1 id="t">페이지를 찾을 수 없어요</h1>
<p id="m">주소를 다시 확인해 주세요.</p>
<p id="open" hidden><a class="btn" id="open-link" href="#">심플차계부 앱에서 열기</a></p>
<p><a class="btn" href="https://play.google.com/store/apps/details?id=com.hueeng.car">Google Play에서 심플차계부 받기</a></p>
<p><a data-doc="" href="/simcha-site/">문서 홈</a> · <a data-doc="privacy" href="/simcha-site/privacy">개인정보처리방침</a> · <a data-doc="terms" href="/simcha-site/terms">이용약관</a> · <a data-doc="account-delete" href="/simcha-site/account-delete">계정 삭제</a></p>
<script>
// GitHub Pages(leehueeng.github.io/simcha-site/)와 car.hueeng.com(루트) 양쪽에서 같은 파일을 쓴다.
var base = location.hostname.indexOf('github.io') !== -1 ? '/simcha-site/' : '/';
document.querySelectorAll('a[data-doc]').forEach(function (a) { a.href = base + a.getAttribute('data-doc'); });
document.querySelector('link[rel=stylesheet]').href = base + 'style.css';

var m = location.pathname.match(/\/chat\/invite\/([^\/?#]+)/);
if (m) {
  document.title = '심플차계부 채팅방 초대';
  document.getElementById('t').textContent = '채팅방 초대 링크예요';
  document.getElementById('m').textContent = '심플차계부 앱이 설치되어 있다면 아래 버튼으로 바로 참여할 수 있어요. 앱이 없다면 먼저 설치한 뒤 다시 링크를 눌러 주세요.';
  document.getElementById('open-link').href = 'io.supabase.sonatacafe://chat/invite/' + encodeURIComponent(decodeURIComponent(m[1]));
  document.getElementById('open').hidden = false;
}
</script>
</body></html>
